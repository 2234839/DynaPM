# 发版流程：更新 CHANGELOG → commit → 打 tag 并推送（git tag v0.x.y && git push origin v0.x.y）
# CI 自动按 tag 触发，多平台构建并把产物上传到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：musl 静态链接，任意发行版零依赖运行
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: dynapm-${{ github.ref_name }}-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: dynapm-${{ github.ref_name }}-linux-aarch64.tar.gz
          # macOS：Apple Silicon（GitHub runner 原生 ARM）
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: dynapm-${{ github.ref_name }}-macos-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: dynapm-${{ github.ref_name }}-macos-x86_64.tar.gz
          # Windows 暂不支持：网关依赖 std::os::unix / UnixStream / netns 等 Unix 专属 API，
          # 移植是独立工程项，待有真实需求再做

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl 目标交叉编译：ring 等带 C 代码的依赖需要 musl-gcc（rustup 工具链不含）
      - name: Install musl cross toolchain
        if: contains(matrix.target, 'unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install aarch64 musl cross compiler
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo/site-packages
          # cc-rs 按 <arch>-linux-musl-gcc 命名找编译器，软链 gnu 交叉编译器即可（ring 不需要 musl 特有 libc 头，链接由 rustc lld 完成）
          mkdir -p ~/.local/bin
          ln -sf $(which aarch64-linux-gnu-gcc) ~/.local/bin/aarch64-unknown-linux-musl-gcc
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 网关用 include_dir! 在编译期嵌入 admin-ui/dist（dist 被 gitignore），必须先构建前端
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build admin-ui
        run: |
          pnpm install --frozen-lockfile --filter admin-ui
          pnpm --filter admin-ui build

      - name: Build
        working-directory: packages/gateway-rs
        run: |
          # aarch64 musl 用 gnu 交叉编译器编 C 依赖，链接参数指向对应工具链
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_musl=aarch64-unknown-linux-musl-gcc
          fi
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --target ${{ matrix.target }}

      - name: Build (windows)
        if: runner.os == 'Windows'
        working-directory: packages/gateway-rs
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
          mkdir -p dist
          cp packages/gateway-rs/target/${{ matrix.target }}/release/dynapm dist/
          cp README.md README_zh.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

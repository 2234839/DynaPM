name: Release to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送版本标签，如 v1.0.4

permissions:
  contents: write
  # 关键配置：允许 GitHub Actions 生成 OIDC 令牌
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js（npm OIDC 发布需要 Node 自带 npm）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run test suites
        run: pnpm --filter @dynapm/gateway test

      - name: Build binary（bun --compile 单文件二进制）
        run: pnpm --filter @dynapm/gateway build

      - name: Verify build output
        run: |
          echo "📦 检查打包输出..."
          ls -la packages/gateway/dist/
          if [ ! -f packages/gateway/dist/dynapm ]; then
            echo "❌ 二进制不存在"
            exit 1
          fi
          echo "✅ 打包输出正常"

      - name: Verify npm version
        run: |
          npm_version=$(npm -v)
          echo "📦 npm 版本: $npm_version"
          echo "✅ Node.js 24 自带的 npm 版本满足 OIDC 要求"

      - name: Publish to npm
        run: npm publish --provenance
        working-directory: packages/gateway
        # 使用 OIDC，不需要 NPM_TOKEN
        # --provenance 标志启用包溯源（npm 推荐的安全实践）

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
            path: ./CHANGELOG.md
            version: ${{ steps.get_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: false

# 发版流程：更新 CHANGELOG → commit → 打 tag 并推送（git tag v0.x.y && git push origin v0.x.y）
# CI 自动按 tag 触发，多平台构建并把产物上传到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：musl 静态链接，任意发行版零依赖运行
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: dynapm-${{ github.ref_name }}-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: dynapm-${{ github.ref_name }}-linux-aarch64.tar.gz
          # macOS：Apple Silicon（GitHub runner 原生 ARM）
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: dynapm-${{ github.ref_name }}-macos-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: dynapm-${{ github.ref_name }}-macos-x86_64.tar.gz
          # Windows：MSVC
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: dynapm-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (linux/macos)
        if: runner.os != 'Windows'
        working-directory: packages/gateway-rs
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --target ${{ matrix.target }}

      - name: Build (windows)
        if: runner.os == 'Windows'
        working-directory: packages/gateway-rs
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp packages/gateway-rs/target/${{ matrix.target }}/release/dynapm dist/
          cp README.md README_zh.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item packages/gateway-rs/target/${{ matrix.target }}/release/dynapm.exe dist/
          Copy-Item README.md, README_zh.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}
          $hash = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File ${{ matrix.archive }}.sha256 -Encoding ascii

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

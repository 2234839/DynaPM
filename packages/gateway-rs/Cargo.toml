[package]
name = "dynapm-gateway-rs"
version = "0.1.0"
edition = "2021"
description = "DynaPM Rust 网关：按需启动 + 闲置回收的反向代理（与 Bun 版行为对齐的并行实现）"

[[bin]]
name = "dynapm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "blocking"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
bytes = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
tower-service = "0.3"
include_dir = "0.7"
libc = "0.2"
arc-swap = "1"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
# 保留符号表：卡死现场需 gdb 抓用户态栈定位死锁（line-tables 不影响运行性能）
strip = "none"
debug = "line-tables-only"
